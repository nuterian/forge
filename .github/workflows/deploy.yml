name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Reads the Pages config. It cannot *create* the site — GITHUB_TOKEN is
      # not allowed to, whatever permissions the workflow asks for — so Pages
      # must be switched on once by hand, with its source set to GitHub
      # Actions (Settings → Pages → Build and deployment → Source).
      - uses: actions/configure-pages@v6

      - run: npm ci

      # `npm run build` typechecks first, so a type error fails the deploy.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
