<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Forge — a generated cosmos</title>
    <meta
      name="description"
      content="Fundamental computer graphics, rendered as space-age print. Six seeded generators built from scratch in WebGL2 and WebGPU."
    />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="canonical" href="https://jugalm.com/forge/" />
    <meta name="theme-color" content="#0a0c13" />
    <meta name="color-scheme" content="dark" />

    <!-- The card a shared link unfurls into. One card for the whole site: the
         chapters are hash routes, and a seed URL is a state of a page, not a
         page. The image is drawn by the project's own rasterizer; see
         tools/make-og.mts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Forge" />
    <meta property="og:title" content="The Forge — a generated cosmos" />
    <meta
      property="og:description"
      content="Fundamental computer graphics, rendered as space-age print. Six seeded generators built from scratch in WebGL2 and WebGPU."
    />
    <meta property="og:url" content="https://jugalm.com/forge/" />
    <meta property="og:image" content="https://jugalm.com/forge/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A seeded star chart with constellation figures, and the title The Forge lettered in a stroke font." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Forge — a generated cosmos" />
    <meta
      name="twitter:description"
      content="Fundamental computer graphics, rendered as space-age print. Six seeded generators built from scratch in WebGL2 and WebGPU."
    />
    <meta name="twitter:image" content="https://jugalm.com/forge/og.png" />
    <!-- What this is, for a reader that is a machine — the same author id as jugalm.com, so the two resolve to one person. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","@id":"https://jugalm.com/forge/#app","name":"The Forge","url":"https://jugalm.com/forge/","applicationCategory":"Graphics","operatingSystem":"Web browser","dateCreated":"2026","image":"https://jugalm.com/forge/og.png","description":"Fundamental computer graphics, rendered as space-age print. Six seeded generators built from scratch in WebGL2 and WebGPU.","author":{"@type":"Person","@id":"https://jugalm.com/#me","name":"Jugal Manjeshwar","url":"https://jugalm.com/"},"isPartOf":{"@id":"https://jugalm.com/#site"}}</script>

    <!-- The faces, ahead of the stylesheet that names them, so the first paint
         is set in them. Self-hosted: see the top of src/ui/style.css. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/ui/fonts/space-grotesk-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/ui/fonts/space-mono-400-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/ui/fonts/space-mono-700-latin.woff2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
